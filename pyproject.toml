[project]
name = "proy-nutria"
version = "0.1.0"
description = "NutrIA - Agente de Nutrición Inteligente con LangChain"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain==0.2.17",
    "langchain-openai==0.1.25",
    "langchain-community==0.2.19",
    "langchain-google-genai==1.0.10",
    "langchain-core==0.2.43",
    "fastapi==0.128.3",
    "uvicorn==0.40.0",
    "python-dotenv==1.2.1",
    "pydantic==2.12.5",
    "requests==2.32.5",
    "pillow==12.1.0",
    "python-multipart==0.0.22",
    "streamlit==1.54.0",
    "watchdog==6.0.0",
    "langgraph>=0.4.5",
    "langgraph-checkpoint-postgres>=3.0.4",
    "psycopg[binary,pool]==3.2.6",
    "httpx>=0.28.1",
    "elasticsearch>=8.0.0,<9.0.0",
    "langchain-elasticsearch>=0.2.0",
    "beautifulsoup4>=4.12.0",
    "jq>=1.11.0",
    "datasets>=4.7.0",
    "pypdf>=6.8.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]
